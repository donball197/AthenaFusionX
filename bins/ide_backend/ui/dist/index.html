<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS SINGULARITY v1.9</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap');
        body { margin: 0; padding: 0; background: #020205; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #05050a; padding: 10px 20px; border-bottom: 1px solid rgba(0, 255, 255, 0.2); display: flex; justify-content: space-between; align-items: center; flex: none; }
        .brand { color: #22d3ee; font-weight: 900; letter-spacing: 2px; }
        .vitals { display: flex; gap: 15px; font-size: 12px; font-weight: bold; }
        .v-cpu { color: #22d3ee; } .v-ram { color: #a78bfa; } .v-temp { color: #34d399; } .v-vmos { color: #fbbf24; }
        .container { display: flex; flex: 1; min-height: 0; }
        .terminal { flex: 1; background: #000; display: flex; flex-direction: column; border-right: 1px solid rgba(167, 139, 250, 0.2); }
        .logs { flex: 1; overflow-y: auto; padding: 15px; font-size: 11px; line-height: 1.5; }
        .log-row { margin-bottom: 4px; display: flex; gap: 10px; }
        .log-ts { color: rgba(255, 255, 255, 0.2); flex: none; }
        .log-msg { white-space: pre-wrap; word-wrap: break-word; }
        .text-cyan-300 { color: #67e8f9; } .text-emerald-400 { color: #34d399; } .text-rose-400 { color: #fb7185; } .text-cyan-700 { color: #0e7490; } .text-purple-300 { color: #d8b4fe; } .text-purple-400 { color: #c084fc; }
        .input-box { background: #010105; padding: 10px; border-top: 1px solid rgba(0, 255, 255, 0.1); display: flex; gap: 10px; flex: none; }
        input { flex: 1; background: transparent; border: 1px solid rgba(34, 211, 238, 0.3); color: #fff; padding: 8px; font-family: inherit; font-size: 12px; outline: none; }
        input:focus { border-color: #22d3ee; }
        button { background: rgba(34, 211, 238, 0.1); color: #22d3ee; border: 1px solid #22d3ee; padding: 0 20px; font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: rgba(34, 211, 238, 0.3); }
        .ghost-cortex { width: 350px; background: #020208; display: flex; flex-direction: column; }
        .ghost-hdr { background: rgba(167, 139, 250, 0.1); padding: 8px 15px; color: #a78bfa; font-weight: bold; font-size: 10px; letter-spacing: 1px; border-bottom: 1px solid rgba(167, 139, 250, 0.2); flex: none; }
        .ghost-body { padding: 15px; overflow-y: auto; color: #d8b4fe; font-size: 11px; white-space: pre-wrap; flex: 1; }
        .blink { animation: blinker 1s linear infinite; color: #22d3ee; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">NEXUS_OS // IDE BACKEND</div>
        <div class="vitals">
            <span class="v-cpu" id="vt-cpu">CPU: 0%</span>
            <span class="v-ram" id="vt-ram">RAM: 0GB</span>
            <span class="v-temp" id="vt-temp">TEMP: 0°C</span>
            <span class="v-vmos" id="vt-vmos">VMOs: 0</span>
            <span id="ws-status" style="color: #fb7185">● OFFLINE</span>
        </div>
    </header>

    <div class="container">
        <div class="terminal">
            <div class="logs" id="logs"></div>
            <div class="input-box">
                <span style="color: #22d3ee; line-height: 32px;">❯</span>
                <input type="text" id="cmd-input" placeholder="Enter directive..." autocomplete="off">
                <button id="send-btn">EXECUTE</button>
            </div>
        </div>
        <div class="ghost-cortex">
            <div class="ghost-hdr">◈ GHOST_CORTEX MONOLOGUE</div>
            <div class="ghost-body" id="ghost-body">Awaiting uplink...</div>
        </div>
    </div>

    <script>
        const logsEl = document.getElementById('logs');
        const ghostEl = document.getElementById('ghost-body');
        const inputEl = document.getElementById('cmd-input');
        const sendBtn = document.getElementById('send-btn');
        const wsStatus = document.getElementById('ws-status');

        let ghostText = '';
        let isTyping = false;

        function addLog(msg, cls = 'text-cyan-300') {
            const time = new Date().toLocaleTimeString();
            const row = document.createElement('div');
            row.className = `log-row ${cls}`;
            row.innerHTML = `<span class="log-ts">[${time}]</span><span class="log-msg">${msg.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`;
            logsEl.appendChild(row);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        function renderGhost() {
            ghostEl.innerHTML = ghostText + (isTyping ? '<span class="blink">█</span>' : '');
            ghostEl.scrollTop = ghostEl.scrollHeight;
        }

        async function sendDirective() {
            const cmd = inputEl.value.trim();
            if (!cmd) return;
            inputEl.value = '';
            addLog(`>> [USER] ${cmd}`, 'text-cyan-300');
            
            try {
                const res = await fetch('/api/task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ directive: cmd })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
            } catch (err) {
                addLog(`!! [FAULT] API unreachable: ${err.message}`, 'text-rose-400');
            }
        }

        inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendDirective(); });
        sendBtn.addEventListener('click', sendDirective);

        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${window.location.host}/ws/telemetry`);

            ws.onopen = () => {
                wsStatus.style.color = '#34d399';
                wsStatus.innerText = '● LIVE';
                addLog('>> Substrate WebSocket Connected', 'text-emerald-400');
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    
                    if (data.type === 'VITALS') {
                        document.getElementById('vt-cpu').innerText = `CPU: ${(data.cpu_load * 100).toFixed(0)}%`;
                        document.getElementById('vt-ram').innerText = `RAM: ${data.ram_gb.toFixed(2)}GB`;
                        document.getElementById('vt-temp').innerText = `TEMP: ${data.temperature.toFixed(1)}°C`;
                        document.getElementById('vt-vmos').innerText = `VMOs: ${data.active_vmos}`;
                    }
                    
                    if (data.type === 'TASK_STATUS' || data.type === 'LOG_EVENT') {
                        isTyping = false;
                        renderGhost();
                        addLog(data.payload, data.type === 'TASK_STATUS' ? 'text-emerald-400' : 'text-cyan-300');
                    }
                    
                    if (data.type === 'NEURAL_THOUGHT') {
                        addLog(`   [THOUGHT] ${data.payload}`, 'text-cyan-700');
                    }

                    if (data.type === 'NEURAL_STREAM') {
                        if (!isTyping) ghostText = '';
                        isTyping = true;
                        ghostText += data.payload;
                        renderGhost();
                    }

                } catch (err) { console.error('WS Parse Error', err); }
            };

            ws.onclose = () => {
                wsStatus.style.color = '#fb7185';
                wsStatus.innerText = '● OFFLINE';
                setTimeout(connectWS, 2000);
            };
        }

        connectWS();
    </script>
</body>
</html>
