[package]
autobins = false
name = "nexus_ide_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
nexus_runtime_core = { path = "../../crates/runtime_core" }
nexus_substrate = { path = "../../crates/nexus_substrate" }
nexus_model_hub = { path = "../../crates/nexus_model_hub" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
axum = { workspace = true }
jsonwebtoken = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
libc = "0.2"
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
once_cell = { workspace = true }
opentelemetry = { version = "0.32", features = ["trace"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "system_monitor_bench"
harness = false

[[bin]]
name = "nexus-ide-backend"
path = "src/main.rs"

[lints]
workspace = true
