id: SQL_INJECTION
language: PHP
severity: High
description: "Unsafe execution of database queries without parameterized prepared statements."
tree_sitter_query: |
  (expression_statement
    (function_call_expression 
      function: (name) @func_name 
      (#match? @func_name "^(mysqli_query|mysqli_multi_query)$")
    )
  ) @danger.sql_injection

  (expression_statement
    (member_call_expression 
      name: (name) @func_name 
      (#match? @func_name "^(query|multi_query)$")
    )
  ) @danger.sql_injection
  
  (expression_statement
    (assignment_expression
      right: (function_call_expression 
        function: (name) @func_name 
        (#match? @func_name "^(mysqli_query|mysqli_multi_query)$")
      )
    )
  ) @danger.sql_injection

  (if_statement 
    condition: (parenthesized_expression 
      (unary_op_expression 
        (function_call_expression 
          function: (name) @func_name 
          (#match? @func_name "^(mysqli_query|mysqli_multi_query)$")
        )
      )
    )
  ) @danger.sql_injection

  (if_statement 
    condition: (parenthesized_expression 
      (unary_op_expression 
        (member_call_expression 
          name: (name) @func_name 
          (#match? @func_name "^(query|multi_query)$")
        )
      )
    )
  ) @danger.sql_injection

  (if_statement 
    condition: (parenthesized_expression 
      (function_call_expression 
        function: (name) @func_name 
        (#match? @func_name "^(mysqli_query|mysqli_multi_query)$")
      )
    )
  ) @danger.sql_injection
