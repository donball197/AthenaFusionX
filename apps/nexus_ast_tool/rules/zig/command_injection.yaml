id: "ZIG_COMMAND_INJECTION"
language: "zig"
severity: "High"
description: "Unsanitized system command execution via std.process.Child or std.os.system."
tree_sitter_query: |
  (call_expression
    function: (field_expression
      field: (identifier) @method (#match? @method "^(system|exec|Child)$")
    )
  ) @danger.command_injection
