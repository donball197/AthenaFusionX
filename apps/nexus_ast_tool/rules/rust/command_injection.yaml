id: "RUST_COMMAND_INJECTION"
language: "rust"
severity: "High"
description: "Spawning an arbitrary subshell via Command::new('sh') or Command::new('bash')."
tree_sitter_query: |
  (call_expression
    function: (field_expression
      value: (_) @recv (#match? @recv "Command::new\\(\"(sh|bash|cmd|powershell)\"\\)")
      field: (field_identifier) @method (#match? @method "^(arg|args)$")
    )
    arguments: (arguments (_) @danger.command_injection)
  )
