id: "GO_COMMAND_INJECTION"
language: "go"
severity: "High"
description: "Unsanitized exec.Command with shell invocation or user-controlled arguments."
tree_sitter_query: |
  (call_expression
    function: (selector_expression
      field: (field_identifier) @method (#match? @method "^(Command|CommandContext)$")
    )
    arguments: (argument_list
      (interpreted_string_literal) @shell (#match? @shell "^\"(sh|bash|cmd)\"$")
    )
  ) @danger.command_injection
  (call_expression
    function: (selector_expression
      field: (field_identifier) @method (#match? @method "^(Command|CommandContext)$")
    )
    arguments: (argument_list . (identifier) @danger.command_injection)
  )
