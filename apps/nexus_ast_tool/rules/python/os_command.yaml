id: "PYTHON_OS_COMMAND_INJECTION"
language: "Python"
severity: "Critical"
description: "Execution of OS commands using unsanitized or dynamic arguments."
tree_sitter_query: |
  (call
    function: (attribute attribute: (identifier) @obj (#match? @obj "^(os|subprocess)$") name: (identifier) @method (#match? @method "^(system|popen|call|check_output|run|Popen)$"))
    arguments: (argument_list) @danger.os_command
  )
