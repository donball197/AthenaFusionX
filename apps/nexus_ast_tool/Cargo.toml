[package]
autobins = false
name = "nexus_ast_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.4"
dotenvy = "0.15"
ureq = { version = "2.9", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.13.2"
ratatui = "0.30.2"
crossterm = "0.29.0"

# Validated Zero-Fragmentation ABI Ecosystem
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-php = "=0.23.1"
serde_yaml = "0.9.34"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }

[[bin]]
name = "nexus-ast-tool"
path = "src/main.rs"

[lints]
workspace = true
