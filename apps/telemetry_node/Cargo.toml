[package]
autobins = false
name = "telemetry_node"
version = "0.1.0"
edition = "2021"

[dependencies]
ide_backend = { package = "nexus_ide_backend", path = "../../bins/ide_backend" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "telemetry-node"
path = "src/main.rs"

[lints]
workspace = true
