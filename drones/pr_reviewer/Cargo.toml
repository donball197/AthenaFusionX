[package]
autobins = false
name = "pr_reviewer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"

[[bin]]
name = "pr-reviewer"
path = "src/main.rs"

[lints]
workspace = true
