name: Android Cross-Build (nexus_cli)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'crates/**'
      - 'apps/nexus_ast_tool/**'
      - 'bins/cli/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Configure linker for aarch64-linux-android
        run: |
          echo "[target.aarch64-linux-android]" >> ~/.cargo/config.toml
          echo "linker = \"${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang\"" >> ~/.cargo/config.toml

      - name: Build nexus_cli
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build --target aarch64-linux-android --release -p nexus_cli
          ls -la target/aarch64-linux-android/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus_cli-android-aarch64
          path: target/aarch64-linux-android/release/nexus_cli
          retention-days: 30
