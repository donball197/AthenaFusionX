name: Android Cross-Build (nexus_cli)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'crates/**'
      - 'apps/nexus_ast_tool/**'
      - 'bins/cli/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Build nexus_cli
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -o ./target-android build \
            -p nexus_cli --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus_cli-android-aarch64
          path: target-android/arm64-v8a/nexus_cli
          retention-days: 30
