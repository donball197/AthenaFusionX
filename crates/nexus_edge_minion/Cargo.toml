[package]
name = "nexus_edge_minion"
version = "0.1.0"
edition = "2021"

[features]
default = []
local_edge = []

[dependencies]
nexus_runtime_core = { path = "../runtime_core" }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
half = "2.3"
ureq = { version = "2", features = ["json"] }
dotenvy.workspace = true
tokenizers = "0.20"

[[bin]]
name = "nexus_minion"
path = "src/bin/nexus_minion.rs"

[lints]
workspace = true
