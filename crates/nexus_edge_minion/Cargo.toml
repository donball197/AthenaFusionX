[package]
name = "nexus_edge_minion"
version = "0.1.0"
edition = "2021"

[features]
default = []
local_edge = ["dep:memmap2"]

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = { version = "0.9", optional = true }
