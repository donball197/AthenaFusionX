[package]
name = "nexus_runtime_core"
version = "0.1.0"
edition = "2021"

[dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
tempfile = "3"
tokio = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tracing = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
libc = "0.2"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
bitflags = "2.4"
sysinfo = { workspace = true }
wasmtime = { version = "45.0.2", features = ["component-model"] }
wasmtime-wasi = { version = "45.0.2" }

nexus_substrate = { path = "../nexus_substrate" }
nexus_model_hub = { path = "../nexus_model_hub" }
thiserror = "2.0.19"
walkdir = "2.5.0"
nexus_ast_tool = { version = "0.1.0", path = "../../apps/nexus_ast_tool" }
nexus_strategy_algorithms = { path = "../../algorithms/strategy" }
nexus_reconnaissance_algorithms = { path = "../../algorithms/reconnaissance" }
nexus_action_identity_algorithms = { path = "../../algorithms/action_identity" }
nexus_algorithms = { path = "../../algorithms/nexus_algorithms" }
sha2 = "0.10"

[lints]
workspace = true

[features]
default = []
cognition_v5 = []
