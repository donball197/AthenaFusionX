[package]
name = "nexus_substrate"
version = "1.9.4"
build = "build.rs"
edition = "2021"

[dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
once_cell = "1.19"
parking_lot = "0.12"

[build-dependencies]
cc = "1.0"
parking_lot = "0.12"
