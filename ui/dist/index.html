<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS SINGULARITY HUD</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; text-transform: uppercase; }
        .header { border-bottom: 2px solid #00ff41; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .stats { font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: repeat(17, 1fr); gap: 5px; }
        .hive { display: flex; flex-direction: column; gap: 5px; }
        .agent { width: 100%; height: 25px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; }
        .active { background: #00ff41; color: #000; box-shadow: 0 0 10px #00ff41; border-color: #fff; }
        .idle { opacity: 0.3; }
        .status-bar { margin-top: 20px; border: 1px solid #00ff41; padding: 10px; background: rgba(0,255,65,0.05); }
    </style>
</head>
<body>
    <div class="header">
        <div>Project Nexus Singularity v0.2.2</div>
        <div id="status" class="stats">INITIALIZING...</div>
    </div>
    
    <div class="stats" id="vitals">RAM: 0MB | LOAD: 0%</div>
    <br>
    <div class="grid" id="swarm-grid"></div>

    <div class="status-bar" id="console">>> SYSTEM_READY: Awaiting Resonance.</div>

    <script>
        async function refresh() {
            try {
                const res = await fetch('/api/vitals');
                const data = await res.json();
                
                document.getElementById('status').innerText = data.status;
                document.getElementById('vitals').innerText = `RAM_SHIELD: ${data.ram_usage} | AGENTS: 68`;
                
                const grid = document.getElementById('swarm-grid');
                grid.innerHTML = '';

                // Group by Hive
                const hives = {};
                data.swarm.forEach(a => {
                    if (!hives[a.hive]) hives[a.hive] = [];
                    hives[a.hive].push(a);
                });

                Object.keys(hives).forEach(h => {
                    const hiveDiv = document.createElement('div');
                    hiveDiv.className = 'hive';
                    hives[h].forEach(a => {
                        const div = document.createElement('div');
                        div.className = `agent ${a.is_active ? 'active' : 'idle'}`;
                        div.innerText = a.id;
                        hiveDiv.appendChild(div);
                    });
                    grid.appendChild(hiveDiv);
                });
            } catch (e) { console.error("Link severed."); }
        }
        setInterval(refresh, 1000);
    </script>
</body>
</html>
