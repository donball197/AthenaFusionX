[build]
rustflags = [
    "-C", "target-cpu=cortex-a73",
    "-C", "target-feature=-fp16",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,--no-keep-memory",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--compress-debug-sections=zlib"
]
jobs = 2
