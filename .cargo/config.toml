[build]
# IMPORTANT: Use 1 job on Duet to stay under 1.5GB RAM
# Change to 2 only if you're sure you have headroom
jobs = 1

# Uncomment below if you install sccache later
rustc-wrapper = "sccache"

# Native ARM64 optimizations strictly scoped to your hardware muscles
[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=cortex-a73",
    "-C", "target-feature=-fp16",
    # Linker flags - lld can help, but disable if you get linker errors
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,--gc-sections",
]

# Strict isolation for WebAssembly to prevent native target contamination
[target.wasm32-wasip1]
rustflags = []

[target.wasm32-unknown-unknown]
rustflags = []


[env]
CARGO_INCREMENTAL = "0"
SCCACHE_DIR = "/mnt/chromeos/removable/Memorex USB/AthenaFusionX/sccache"
