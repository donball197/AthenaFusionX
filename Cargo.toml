[package]
name = "nexus_singularity"
version = "0.7.0"
edition = "2021"
default-run = "nexus_singularity"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
image = "0.24"
base64 = "0.21"
screenshots = "0.8"
rust-embed = "8.2"
mime_guess = "2.0"
futures = "0.3"
walkdir = "2.4"
redis = { version = "0.24", features = ["tokio-comp"] }
mimalloc = "0.1.48"
sysinfo = "0.38.2"
libc = "0.2"

[[bin]]
name = "nexus_singularity"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
