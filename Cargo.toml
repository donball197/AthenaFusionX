[package]
name = "nexus_singularity"
version = "0.5.0"
edition = "2021"

[dependencies]
# Core Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Web Server & HTTP
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "limit"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Vision & System
image = "0.24"
base64 = "0.21"
screenshots = "0.8"
mimalloc = "0.1"

# UI Embedding (The Monolith Build)
rust-embed = "8.2"
mime_guess = "2.0"

[profile.release]
opt-level = 3       # Max optimization
lto = true          # Link Time Optimization (smaller binary, faster code)
codegen-units = 1   # Slower compile, better optimization
strip = true        # Remove symbols to save RAM
panic = "abort"     # Crash immediately on panic to save space
