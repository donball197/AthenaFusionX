[workspace]
members = [
    "crates/runtime_core",
    "crates/identity",
    "crates/memory_graph",
    "crates/economy",
    "crates/protocol",
    "crates/mesh",
    "crates/payments",
    "crates/marketplace",
    "crates/billing",
    "bins/cli",
    "bins/node",
    "bins/ide_backend"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "3.0.0"

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
panic = "abort"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
