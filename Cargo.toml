[workspace]
members = [
    "crates/runtime_core", "crates/identity", "crates/memory_graph", "crates/mesh",
    "bins/cli", "bins/node", "bins/ide_backend"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "3.0.0"

[workspace.dependencies]
tokio              = { version = "1.44", features = ["full", "io-util"] }
serde              = { version = "1.0",  features = ["derive"] }
serde_json         = "1.0"
anyhow             = "1.0"
reqwest            = { version = "0.12", features = ["json", "stream"] }
axum               = { version = "0.7",  features = ["ws", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls", "macros", "migrate"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell          = "1.19"
parking_lot        = "0.12"
async-trait        = "0.1"
base64             = "0.22"
uuid               = { version = "1.8", features = ["v4", "serde"] }
futures-util       = "0.3"
tower-http         = { version = "0.5", features = ["fs", "cors", "trace"] }
dotenvy            = "0.15"
bitflags           = "2.4"
jsonwebtoken       = "9.3"
sysinfo            = "0.31"
mime_guess         = "2.0"
rust-embed         = "8.0"

[profile.dev]
opt-level     = 0
debug         = true
incremental   = true
codegen-units = 256
panic         = "abort"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
