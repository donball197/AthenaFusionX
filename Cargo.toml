[package]
name = "nexus_singularity"
version = "0.13.2"
edition = "2021"

[dependencies]
mimalloc = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
dotenvy = "0.15"
base64 = "0.21"
chrono = "0.4"
image = "0.24"
axum = { version = "0.6", features = ["ws"] }
tower-http = { version = "0.4", features = ["cors", "fs"] }
tokio-tungstenite = "0.20"
portable-pty = "0.8"
futures-util = "0.3"
screenshots = "0.8.10"

[build-dependencies]
cc = "1.0"

[features]
default = []
mobile = []
