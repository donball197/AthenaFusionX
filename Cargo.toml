[package]
name = "nexus_singularity"
version = "2.5.3"
edition = "2021"
rust-version = "1.80"

[features]
default = []
future_npu = ["dep:tflite"]

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
dotenvy = "0.15"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
anyhow = "1.0"
bitflags = "2.6"
once_cell = "1.20"
regex = "1.11"
prometheus = "0.13"
rust-embed = "8.5"
mime_guess = "2.0"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"
mimalloc = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "macros", "chrono"] }
tflite = { version = "0.9.8", optional = true }
indicatif = "0.18"
comfy-table = "7.2"

[build-dependencies]

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z"        # Size-optimized for 4GB device
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false
