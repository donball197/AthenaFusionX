[package]
name = "nexus_singularity"
default-run = "nexus_singularity"
version = "1.9.0"
edition = "2021"
rust-version = "1.80"

[features]
default = []
vision = []

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls", "macros"] }
mimalloc = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.21"
sha2 = "0.10"
walkdir = "2.5"
bitflags = "2.8"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
futures-util = "0.3.32"
scraper = "0.19"
bytes = "1.5"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
async-trait = "0.1.89"
sysinfo = "0.36.1"
lazy_static = "1.5.0"

[profile.release]
opt-level = 2
lto = false
codegen-units = 32
panic = "abort"
strip = true
debug = false
incremental = false
