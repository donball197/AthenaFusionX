[package]
name = "nexus_singularity"
version = "2.3.1"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower-cookies = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls", "macros"] }
mimalloc = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.21"
sha2 = "0.10"
walkdir = "2.5"
bitflags = "2.8"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
futures-util = "0.3.32"
scraper = "0.19"
bytes = "1.5"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
async-trait = "0.1.89"
sysinfo = "0.36.1"
lazy_static = "1.5.0"
wasmtime = "21.0.0"
parking_lot = "0.12.5"
local-ip-address = "0.6.12"
pdf-extract = "0.7.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = "9.3.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8"

[profile.release]
opt-level = "z"      # ⚡ Optimize for smallest binary size
lto = true           # ⚡ Link-Time Optimization (merges code across files)
panic = "abort"      # ⚡ Removes error-recovery bloat (saves space)
codegen-units = 1    # ⚡ Maximum focus for the compiler
strip = true         # ⚡ Physically remove debug symbols

[[bin]]
name = "nexus_cli"
path = "src/bin/cli.rs"

[[bin]]
name = "prime_wasm"
path = "src/bin/prime_wasm.rs"

[[bin]]
name = "thermal_probe"
path = "src/bin/thermal_probe.rs"

[[bin]]
name = "ui_audit"
path = "src/bin/ui_audit.rs"

[[bin]]
name = "alpha_scout"
path = "src/bin/alpha_scout.rs"

[[bin]]
name = "global_audit"
path = "src/bin/global_audit.rs"

[[bin]]
name = "smoke_test"
path = "src/bin/smoke_test.rs"

[[bin]]
name = "upgrade"
path = "src/bin/upgrade.rs"

[[bin]]
name = "swarm_sim"
path = "src/bin/swarm_sim.rs"

[[bin]]
name = "quantum_ingestor"
path = "src/bin/quantum_ingestor.rs"
