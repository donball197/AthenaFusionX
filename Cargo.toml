[package]
name = "nexus_singularity"
version = "0.9.9"
edition = "2021"
default-run = "nexus_singularity"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
image = "0.24"
base64 = "0.21"
screenshots = "0.8"
rust-embed = "8.2"
mime_guess = "2.0"
futures = "0.3"
walkdir = "2.4"
redis = { version = "0.24", features = ["tokio-comp"] }
mimalloc = "0.1.48" # Critical for ARM64 Memory fragmentation handling
sysinfo = "0.30"
libc = "0.2"
memmap2 = "0.9"
prometheus = "0.13"
blake3 = "1.8.3"

[[bin]]
name = "nexus_singularity"
path = "src/main.rs"

[[bin]]
name = "sentry"
path = "src/bin/sentry.rs"

# LENOVO DUET 2 OPTIMIZATION PROFILE
[profile.release]
opt-level = "z"     # Optimize for SIZE (Smaller binary = Less RAM used to load it)
lto = true          # Link Time Optimization (Removes unused code)
codegen-units = 1   # CRITICAL: Prevents RAM explosion during compilation
strip = true        # Strips symbols (Smaller binary)
panic = "abort"     # Removes stack unwinding code (Smaller binary)

[dev-dependencies]
tempfile = "3.26.0"
