[workspace]
members = [
    "apps/nexus_ast_tool",
    "apps/benchmark_runner",
    "crates/nexus_edge_minion",
    "apps/code_auditor",
    "crates/runtime_core",
    "crates/executive_cortex",
    "crates/identity",
    "crates/memory_graph",
    "crates/protocol",
    "crates/mesh",
    "crates/nexus_substrate",
    "crates/nexus_model_hub",
    "crates/nexus_search",
    "bins/cli",
    "bins/node",
    "bins/ide_backend",
    "apps/telemetry_node",
    "apps/logic_cell",
    "apps/symbol_graph",
    "apps/repository_planner",
    "apps/hello_sidecar",
    "apps/impact_analyzer",
    "apps/mutation_planner",
    "apps/verification_runner",
    "apps/execution_auditor",
    "apps/mutation_ranker",
    "apps/math_utils",
    "drones/pr_reviewer",
    "apps/wasm_tester",
    "drones/data_scraper",
    "apps/nexus_scrape",
    "apps/wasm_tester",
    "drones/data_scraper",
    "apps/nexus_scrape"
, "drones/health_api"]
resolver = "2"
exclude = [
    "comparison_workspace"
]

[workspace.package]
edition = "2021"
version = "3.0.0"

[workspace.dependencies]
anyhow                 = "1.0"
async-trait            = "0.1"
axum                   = { version = "0.7", features = ["macros", "ws"] }
base64                 = "0.22"
dotenvy                = "0.15"
futures-util           = "0.3"
jsonwebtoken           = "9.3"
mime_guess             = "2.0"
once_cell              = "1.19"
parking_lot            = "0.12"
reqwest                = { version = "0.12", features = ["json", "stream", "blocking"] }
rust-embed             = "8.0"
serde                  = { version = "1.0", features = ["derive"] }
serde_json             = "1.0"
sqlx                   = { version = "0.8", features = ["runtime-tokio", "sqlite", "tls-rustls"] }
sysinfo                = "0.31"
tokio                  = { version = "1.44", features = ["full"] }
tower-http             = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter", "json"] }
uuid                   = { version = "1.8", features = ["serde", "v4"] }
wasmtime               = "45.0.2"
wasmtime-wasi          = "45.0.2"

[profile.dev]
opt-level = 1
debug = false
incremental = false
codegen-units = 1
panic = "abort"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = "z"

[workspace.lints.clippy]
needless-question-mark = "allow"
