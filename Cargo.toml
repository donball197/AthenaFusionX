[package]
name = "nexus_singularity"
version = "0.12.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
mimalloc = "0.1"
memmap2 = "0.9"
async-trait = "0.1"
dotenvy = "0.15"
