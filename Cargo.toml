[workspace]
resolver = "2"
members = [
    "crates/runtime_core",
    "crates/identity",
    "crates/memory_graph",
    "crates/protocol",
    "crates/mesh",
    "crates/nexus_substrate",
    "crates/nexus_model_hub",
    "crates/nexus_search",
    "bins/cli",
    "bins/node",
    "bins/ide_backend",
    "apps/telemetry_node",
    "target_dummy"
]

[workspace.package]
edition = "2021"
version = "3.0.0"

[workspace.dependencies]
anyhow                 = "1.0"
async-trait            = "0.1"
axum                   = { version = "0.7", features = ["macros", "ws"] }
base64                 = "0.22"
dotenvy                = "0.15"
futures-util           = "0.3"
jsonwebtoken           = "9.3"
mime_guess             = "2.0"
once_cell              = "1.19"
parking_lot            = "0.12"
reqwest                = { version = "0.12", features = ["json", "stream", "blocking"] }
rust-embed             = "8.0"
serde                  = { version = "1.0", features = ["derive"] }
serde_json             = "1.0"
sqlx                   = { version = "0.8", features = ["runtime-tokio", "sqlite", "tls-rustls"] }
sysinfo                = "0.31"
tokio                  = { version = "1.44", features = ["full"] }
tower-http             = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter", "json"] }
uuid                   = { version = "1.8", features = ["serde", "v4"] }
wasmtime               = "45.0.2"
wasmtime-wasi          = "45.0.2"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true
codegen-units = 2
panic = "abort"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = "z"

[workspace.lints.clippy]
needless-question-mark = "allow"

# ============================================================
# Fast iteration profile - optimized for low RAM devices
# ============================================================
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true
panic = "abort"
codegen-units = 4
