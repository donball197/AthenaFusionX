[package]
name = "nexus_singularity"
version = "1.9.0"
edition = "2021"

[features]
default = []
future_npu = []

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
dotenvy = "0.15"
walkdir = "2.4"
rustyline = "12.0"
clap = { version = "4.4", features = ["derive"] }
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
anyhow = "1.0"
bitflags = "2.4"
once_cell = "1.18"
regex = "1.10"
prometheus = "0.13"
rust-embed = "8.2"
mime_guess = "2.0"
tower-http = { version = "0.5", features = ["cors", "fs"] }
screenshots = "0.8"
base64 = "0.21"
image = "0.24"
mimalloc = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tokio-rusqlite = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
cc = "1.0"
